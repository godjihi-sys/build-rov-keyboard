name: Build ROV Code Keyboard APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses || true

    - name: Create Full Android Project
      run: |
        mkdir -p ROVKeyboard/.github
        mkdir -p ROVKeyboard/gradle/wrapper
        mkdir -p ROVKeyboard/app/src/main/java/com/rovkeyboard/app
        mkdir -p ROVKeyboard/app/src/main/res/xml
        mkdir -p ROVKeyboard/app/src/main/res/values
        mkdir -p ROVKeyboard/app/src/main/res/layout
        mkdir -p ROVKeyboard/app/src/main/res/mipmap-mdpi
        mkdir -p ROVKeyboard/app/src/main/res/mipmap-hdpi
        mkdir -p ROVKeyboard/app/src/main/res/mipmap-xhdpi
        mkdir -p ROVKeyboard/app/src/main/res/mipmap-xxhdpi

        # settings.gradle
        cat > ROVKeyboard/settings.gradle << 'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "ROVKeyboard"
include ':app'
EOF

        # root build.gradle
        cat > ROVKeyboard/build.gradle << 'EOF'
plugins {
    id 'com.android.application' version '8.2.0' apply false
}
EOF

        # gradle wrapper properties
        cat > ROVKeyboard/gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF

        # app build.gradle
        cat > ROVKeyboard/app/build.gradle << 'EOF'
plugins {
    id 'com.android.application'
}
android {
    namespace 'com.rovkeyboard.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.rovkeyboard.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
EOF

        # AndroidManifest.xml
