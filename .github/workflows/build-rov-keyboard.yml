        # MainActivity.java
        cat > ROVKeyboard/app/src/main/java/com/rovkeyboard/app/MainActivity.java << 'EOF'
package com.rovkeyboard.app;
import android.content.Intent;
import android.os.Bundle;
import android.provider.Settings;
import android.view.inputmethod.InputMethodManager;
import android.widget.Button;
import androidx.appcompat.app.AppCompatActivity;
public class MainActivity extends AppCompatActivity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);
        Button btnEnable = findViewById(R.id.btnEnableIME);
        btnEnable.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)));
        Button btnSwitch = findViewById(R.id.btnSwitchIME);
        btnSwitch.setOnClickListener(v -> {
            InputMethodManager imm = (InputMethodManager) getSystemService(INPUT_METHOD_SERVICE);
            imm.showInputMethodPicker();
        });
    }
}
EOF

        # ROVKeyboardService.java
        cat > ROVKeyboard/app/src/main/java/com/rovkeyboard/app/ROVKeyboardService.java << 'EOF'
package com.rovkeyboard.app;
import android.content.res.ColorStateList;
import android.inputmethodservice.InputMethodService;
import android.os.Handler;
import android.os.Looper;
import android.view.View;
import android.view.inputmethod.InputConnection;
import android.view.inputmethod.InputMethodManager;
import android.widget.Button;
import android.widget.EditText;
import android.widget.TextView;
public class ROVKeyboardService extends InputMethodService {
    private EditText etCode;
    private TextView tvStatus;
    private Handler handler = new Handler(Looper.getMainLooper());
    private int charDelay = 120;
    private boolean isTyping = false;
    private View rootView;
    @Override
    public View onCreateInputView() {
        rootView = getLayoutInflater().inflate(R.layout.keyboard_view, null);
        etCode = rootView.findViewById(R.id.etCode);
        tvStatus = rootView.findViewById(R.id.tvStatus);
        Button btnType = rootView.findViewById(R.id.btnType);
        Button btnClear = rootView.findViewById(R.id.btnClear);
        Button btnSwitch = rootView.findViewById(R.id.btnSwitch);
        Button btnSlow = rootView.findViewById(R.id.btnSlow);
        Button btnNormal = rootView.findViewById(R.id.btnNormal);
        Button btnFast = rootView.findViewById(R.id.btnFast);
        btnSlow.setOnClickListener(v -> { charDelay = 250; setStatus("ช้า"); highlight(btnSlow,btnNormal,btnFast,0); });
        btnNormal.setOnClickListener(v -> { charDelay = 120; setStatus("ปกติ"); highlight(btnSlow,btnNormal,btnFast,1); });
        btnFast.setOnClickListener(v -> { charDelay = 50; setStatus("เร็ว"); highlight(btnSlow,btnNormal,btnFast,2); });
        btnClear.setOnClickListener(v -> { etCode.setText(""); setStatus("ล้างแล้ว"); });
        btnSwitch.setOnClickListener(v -> ((InputMethodManager)getSystemService(INPUT_METHOD_SERVICE)).showInputMethodPicker());
        btnType.setOnClickListener(v -> {
            if (isTyping) {
                isTyping = false;
                handler.removeCallbacksAndMessages(null);
                setStatus("หยุดแล้ว");
                btnType.setText("พิมให้!");
                return;
            }
            String code = etCode.getText().toString();
            if (code.isEmpty()) { setStatus("วางโค้ดก่อนนะ!"); return; }
            if (getCurrentInputConnection() == null) { setStatus("ไม่มี connection"); return; }
            isTyping = true;
            btnType.setText("หยุด");
            typeNext(code, 0);
        });
        return rootView;
    }
    private void typeNext(String code, int index) {
        if (!isTyping || index >= code.length()) {
            if (isTyping) {
                isTyping = false;
                setStatus("พิมเสร็จ! (" + code.length() + " ตัว)");
                handler.post(() -> { Button b = rootView.findViewById(R.id.btnType); if(b!=null) b.setText("พิมให้!"); });
            }
            return;
        }
        int pct = (int)((float)index / code.length() * 100);
        setStatus("กำลังพิม " + pct + "% (" + (index+1) + "/" + code.length() + ")");
        handler.postDelayed(() -> {
            if (!isTyping) return;
            InputConnection ic = getCurrentInputConnection();
            if (ic != null) ic.commitText(String.valueOf(code.charAt(index)), 1);
            typeNext(code, index + 1);
        }, charDelay);
    }
    private void setStatus(String msg) { handler.post(() -> { if(tvStatus!=null) tvStatus.setText(msg); }); }
    private void highlight(Button a, Button b, Button c, int sel) {
        int on=0xFFE94560, off=0xFF333355;
        a.setBackgroundTintList(ColorStateList.valueOf(sel==0?on:off));
        b.setBackgroundTintList(ColorStateList.valueOf(sel==1?on:off));
        c.setBackgroundTintList(ColorStateList.valueOf(sel==2?on:off));
    }
    @Override public boolean onEvaluateFullscreenMode() { return false; }
}
EOF

        # Create launcher icons
        python3 << 'PYEOF'
import struct, zlib
def make_png(size, r, g, b):
    def chunk(name, data):
        c = zlib.crc32(name + data) & 0xffffffff
        return struct.pack('>I', len(data)) + name + data + struct.pack('>I', c)
    sig = b'\x89PNG\r\n\x1a\n'
    ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0))
    raw = b''.join(b'\x00' + bytes([r, g, b] * size) for _ in range(size))
    idat = chunk(b'IDAT', zlib.compress(raw))
    iend = chunk(b'IEND', b'')
    return sig + ihdr + idat + iend
for dpi, sz in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144)]:
    with open(f'ROVKeyboard/app/src/main/res/mipmap-{dpi}/ic_launcher.png','wb') as f:
        f.write(make_png(sz, 233, 69, 96))
print("Icons OK")
PYEOF

        # Download gradle wrapper JAR
        curl -sL -o ROVKeyboard/gradle/wrapper/gradle-wrapper.jar \
          https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar

        # Create gradlew script
        cat > ROVKeyboard/gradlew << 'EOF'
#!/bin/sh
exec java $JAVA_OPTS -jar "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" "$@"
EOF
        chmod +x ROVKeyboard/gradlew

        echo "=== Project structure ==="
        find ROVKeyboard -type f | sort

    - name: Build Debug APK
      working-directory: ROVKeyboard
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ROV-Code-Keyboard-APK
        path: ROVKeyboard/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
